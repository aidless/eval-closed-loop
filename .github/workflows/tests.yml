name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject.toml (requires-python >= 3.10),
        # 3.12 is the current stable. Both have been run locally.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Runtime dependencies are empty; the dev extra is pytest. The editable
      # install also checks that the setuptools src-layout config still builds.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # src/eval_loop/stats.py imports eval_gate from a sibling checkout instead
      # of vendoring the statistics (it raises ImportError with setup
      # instructions when the module is missing). Pinned to a commit so a change
      # over there cannot turn this repo red without a deliberate bump here.
      - name: Check out eval-gate (statistics dependency)
        uses: actions/checkout@v4
        with:
          repository: aidless/eval-gate
          ref: 9e0e629e6c4f968c7114f1efa05b4084a172037f
          path: _eval_gate

      - name: Run tests
        env:
          EC_EVAL_GATE_PATH: ${{ github.workspace }}/_eval_gate
        run: python -m pytest tests -q
